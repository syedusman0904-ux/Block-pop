<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BlockPop &mdash; Classic</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page" data-mode="classic">

<canvas id="bgCanvas"></canvas>

<div class="app">
  <header class="topbar">
    <a href="index.html" class="back-btn" aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <span class="mode-title">Classic</span>
    <span class="topbar-spacer"></span>
  </header>

  <div class="hud">
    <div class="stat">
      <span class="label">SCORE</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="stat right">
      <span class="label">BEST</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div class="board-frame">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <canvas class="fx-canvas" id="fxCanvas"></canvas>
    </div>
  </div>

  <div class="tray" id="tray"></div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="overTitle">Game Over</h2>
    <p class="final">Score <span id="finalScore">0</span></p>
    <div class="panel-buttons">
      <button id="restart">Play Again</button>
      <a href="index.html" class="btn-link">Home</a>
    </div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
